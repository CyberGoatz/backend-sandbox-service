name: Build and push Docker image to ACR

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ${{ vars.ACR_IMAGE_NAME || 'sandbox-service' }}

jobs:
  quality-checks:
    name: Quality checks (${{ matrix.env }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        env:
          - pre-commit
          - pylint
          - bandit
          - audit
          - pytest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.12"

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Run tox (${{ matrix.env }})
        run: tox -q -e ${{ matrix.env }} --override testenv.ignore_outcome=false

  build-and-push:
    name: Build and push
    runs-on: ubuntu-24.04
    needs: quality-checks
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate registry configuration
        run: |
          test -n "${{ env.ACR_LOGIN_SERVER }}" || (echo "Set repository variable ACR_LOGIN_SERVER, for example myregistry.azurecr.io" && exit 1)
          test -n "${{ secrets.ACR_USERNAME }}" || (echo "Set repository secret ACR_USERNAME" && exit 1)
          test -n "${{ secrets.ACR_PASSWORD }}" || (echo "Set repository secret ACR_PASSWORD" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
